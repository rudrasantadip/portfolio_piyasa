<div
class="sidenav-header">
    <img 
    [width]="profilePicSize()"
    [height]="profilePicSize()"
    src="/assets/piyasa.jpeg" alt="">
    <div class="header-text" [class.hide-header-text]="sideNavCollapsed()">
        <h2>My Portfolio</h2>
        <p>Piyasa Dey</p>
    </div>
</div>
<mat-nav-list>
    <a 
    class="menu-item"
    mat-list-item 
    *ngFor="let item of menuItems()"
    [routerLink]="item.route"
    routerLinkActive="selected-menu-item"
    #rla="routerLinkActive"
    [activated]="rla.isActive"

    >
        <mat-icon
        [fontSet]="rla.isActive?'material-icons':'material-icons-outlined'"
         matListItemIcon>{{item.icon}}</mat-icon>
        <span
        *ngIf="!sideNavCollapsed()"
         matListItemTitle>{{item.label}}</span>
    </a>

    <a 
    class="menu-item"
    mat-list-item 
    routerLinkActive="selected-menu-item"
    #rla="routerLinkActive"
    [activated]="rla.isActive"
    target="_blank"
    href="/assets/resume.pdf"

    >
        <mat-icon
        [fontSet]="rla.isActive?'material-icons':'material-icons-outlined'"
         matListItemIcon><i class="fa-solid fa-file"></i></mat-icon>
        <span
        *ngIf="!sideNavCollapsed()"
         matListItemTitle>Resume</span>
    </a>
</mat-nav-list>
